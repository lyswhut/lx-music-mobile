<svg xmlns="http://www.w3.org/2000/svg" width="1730" height="1580" viewBox="0 0 1730 1580"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#455a64"/></marker></defs><rect width="1730" height="1580" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="35" y="57" font-size="32" fill="#263238"><tspan x="35" dy="0">LX Music → HarmonyOS NEXT：实际项目架构与 RNOH 桥接原理</tspan></text>
<text x="35" y="98" font-size="20" fill="#263238"><tspan x="35" dy="0">代码版本：feat/harmony-port · React Native 0.72.5 / RNOH 0.72.144 · C-API 架构</tspan></text>
<rect x="35" y="130" width="500" height="170" rx="12" fill="#e3f2fd" stroke="#263238" stroke-width="1.5"/>
<text x="53" y="166" font-size="24" fill="#263238"><tspan x="53" dy="0">① 复用 React Native 业务</tspan></text>
<text x="53" y="204" font-size="20" fill="#263238"><tspan x="53" dy="0">src/screens / components：搜索、歌单、歌词</tspan><tspan x="53" dy="28">src/core / store：播放编排、状态、设置</tspan><tspan x="53" dy="28">index.harmony.js 注册 appKey = lxmusic</tspan></text>
<rect x="615" y="130" width="500" height="170" rx="12" fill="#e3f2fd" stroke="#263238" stroke-width="1.5"/>
<text x="633" y="166" font-size="24" fill="#263238"><tspan x="633" dy="0">② Metro 选择 Harmony 实现</tspan></text>
<text x="633" y="204" font-size="20" fill="#263238"><tspan x="633" dy="0">react-native → @react-native-oh/...</tspan><tspan x="633" dy="28">优先 *.harmony.ts(x)；vendor 保留接口</tspan><tspan x="633" dy="28">输出 bundle.harmony.js 与字体 / 图片</tspan></text>
<rect x="1195" y="130" width="500" height="170" rx="12" fill="#e8f5e9" stroke="#263238" stroke-width="1.5"/>
<text x="1213" y="166" font-size="24" fill="#263238"><tspan x="1213" dy="0">③ Harmony 原生宿主启动</tspan></text>
<text x="1213" y="204" font-size="20" fill="#263238"><tspan x="1213" dy="0">EntryAbility extends RNAbility</tspan><tspan x="1213" dy="28">Index.ets：RNApp 加载 Metro / rawfile</tspan><tspan x="1213" dy="28">createRNPackages + C++ PackageProvider</tspan></text>
<path d="M535,210 L615,210" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1115,210 L1195,210" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="368" font-size="26" fill="#263238"><tspan x="35" dy="0">A. 界面渲染链路：React 组件转换为鸿蒙原生节点</tspan></text>
<rect x="35" y="400" width="500" height="190" rx="12" fill="#e3f2fd" stroke="#263238" stroke-width="1.5"/>
<text x="53" y="436" font-size="24" fill="#263238"><tspan x="53" dy="0">React / JS 运行时</tspan></text>
<text x="53" y="474" font-size="20" fill="#263238"><tspan x="53" dy="0">Root：react-navigation + Provider</tspan><tspan x="53" dy="28">React reconciliation → Fabric Shadow Tree</tspan><tspan x="53" dy="28">Yoga 计算布局；提交组件更新</tspan></text>
<rect x="615" y="400" width="500" height="190" rx="12" fill="#fff3e0" stroke="#263238" stroke-width="1.5"/>
<text x="633" y="436" font-size="24" fill="#263238"><tspan x="633" dy="0">RNOH C++ / Fabric</tspan></text>
<text x="633" y="474" font-size="20" fill="#263238"><tspan x="633" dy="0">ComponentDescriptor / ComponentInstance</tspan><tspan x="633" dy="28">Package 工厂创建对应原生组件</tspan><tspan x="633" dy="28">C-API 主路径 + ArkTS 自定义组件</tspan></text>
<rect x="1195" y="400" width="500" height="190" rx="12" fill="#e8f5e9" stroke="#263238" stroke-width="1.5"/>
<text x="1213" y="436" font-size="24" fill="#263238"><tspan x="1213" dy="0">ArkUI 与系统窗口</tspan></text>
<text x="1213" y="474" font-size="20" fill="#263238"><tspan x="1213" dy="0">C-API 创建 / 更新 ArkUI Node</tspan><tspan x="1213" dy="28">screens、slider 等通过 ArkTS builder</tspan><tspan x="1213" dy="28">原生触摸事件返回 RN 事件系统</tspan></text>
<path d="M535,470 L615,470" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<text x="537" y="449" font-size="18" fill="#455a64"><tspan x="537" dy="0">渲染提交</tspan></text>
<path d="M1115,470 L1195,470" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1118" y="449" font-size="18" fill="#455a64"><tspan x="1118" dy="0">属性 / 布局</tspan></text>
<path d="M1445,614 L285,614" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
<text x="450" y="643" font-size="18" fill="#2e7d32"><tspan x="450" dy="0">事件 / 点击 → RNOH → JS 回调</tspan></text>
<text x="35" y="711" font-size="26" fill="#263238"><tspan x="35" dy="0">B. 原生能力调用：JSI + C++ 方法表 + ArkTS TurboModule</tspan></text>
<rect x="35" y="745" width="500" height="195" rx="12" fill="#e3f2fd" stroke="#263238" stroke-width="1.5"/>
<text x="53" y="781" font-size="24" fill="#263238"><tspan x="53" dy="0">JS 原生适配层</tspan></text>
<text x="53" y="819" font-size="20" fill="#263238"><tspan x="53" dy="0">TurboModuleRegistry.getEnforcing(name)</tspan><tspan x="53" dy="28">如 LXTrackPlayer / UtilsModule</tspan><tspan x="53" dy="28">调用方法，等待 Promise；订阅 DeviceEventEmitter</tspan></text>
<rect x="615" y="745" width="500" height="195" rx="12" fill="#fff3e0" stroke="#263238" stroke-width="1.5"/>
<text x="633" y="781" font-size="24" fill="#263238"><tspan x="633" dy="0">C++：LXMusicPackage.h</tspan></text>
<text x="633" y="819" font-size="20" fill="#263238"><tspan x="633" dy="0">ArkTSTurboModule + methodMap_</tspan><tspan x="633" dy="28">ARK_ASYNC / SCHEDULE_METHOD_METADATA</tspan><tspan x="633" dy="28">登记方法名、参数个数和调度方式</tspan></text>
<rect x="1195" y="745" width="500" height="195" rx="12" fill="#e8f5e9" stroke="#263238" stroke-width="1.5"/>
<text x="1213" y="781" font-size="24" fill="#263238"><tspan x="1213" dy="0">ArkTS：LXMusicPackage.ets</tspan></text>
<text x="1213" y="819" font-size="20" fill="#263238"><tspan x="1213" dy="0">名称 → UITurboModule 工厂实例</tspan><tspan x="1213" dy="28">Utils / TrackPlayer / Crypto / UserApi</tspan><tspan x="1213" dy="28">调用 Harmony SDK：fs、AVPlayer、AVSession</tspan></text>
<path d="M535,815 L615,815" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<text x="537" y="793" font-size="18" fill="#455a64"><tspan x="537" dy="0">JSI 调用</tspan></text>
<path d="M1115,815 L1195,815" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1116" y="793" font-size="18" fill="#455a64"><tspan x="1116" dy="0">RNOH 调度</tspan></text>
<path d="M1445,965 L285,965" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
<text x="365" y="995" font-size="18" fill="#2e7d32"><tspan x="365" dy="0">Promise 结果 / 错误返回；原生 emitDeviceEvent → JS 监听器</tspan></text>
<text x="35" y="1048" font-size="21" fill="#263238"><tspan x="35" dy="0">桥接例子：JS await player.play() → C++ 方法表 → TrackPlayerModule.ets → AVPlayer.play()</tspan></text>
<text x="35" y="1084" font-size="21" fill="#263238"><tspan x="35" dy="0">关键约束：JS 名称、C++ 方法签名、ArkTS 工厂必须一致；JS 与 ArkTS 不是同一个运行时。</tspan></text>
<text x="35" y="1146" font-size="26" fill="#263238"><tspan x="35" dy="0">C. 自定义音源：隔离脚本引擎与真实歌曲播放</tspan></text>
<rect x="35" y="1180" width="500" height="195" rx="12" fill="#e3f2fd" stroke="#263238" stroke-width="1.5"/>
<text x="53" y="1216" font-size="24" fill="#263238"><tspan x="53" dy="0">音源与播放器业务</tspan></text>
<text x="53" y="1254" font-size="20" fill="#263238"><tspan x="53" dy="0">src/core/init/userApi：导入 / 初始化</tspan><tspan x="53" dy="28">core/music：音质选择、请求歌曲地址</tspan><tspan x="53" dy="28">播放 URL → vendor TrackPlayer 适配层</tspan></text>
<rect x="615" y="1180" width="500" height="195" rx="12" fill="#fff3e0" stroke="#263238" stroke-width="1.5"/>
<text x="633" y="1216" font-size="24" fill="#263238"><tspan x="633" dy="0">Worker + QuickJS（独立引擎）</tspan></text>
<text x="633" y="1254" font-size="20" fill="#263238"><tspan x="633" dy="0">UserApiModule → ThreadWorker 消息</tspan><tspan x="633" dy="28">UserApiWorker → NAPI liblx_user_api.so</tspan><tspan x="633" dy="28">QuickJS 执行音源；HTTP / crypto 由宿主提供</tspan></text>
<rect x="1195" y="1180" width="500" height="195" rx="12" fill="#e8f5e9" stroke="#263238" stroke-width="1.5"/>
<text x="1213" y="1216" font-size="24" fill="#263238"><tspan x="1213" dy="0">系统音频 / 文件能力</tspan></text>
<text x="1213" y="1254" font-size="20" fill="#263238"><tspan x="1213" dy="0">AVPlayer：音频解码与进度</tspan><tspan x="1213" dy="28">AVSession：媒体会话与遥控事件</tspan><tspan x="1213" dy="28">后台播放长时任务；fs / picker 保存文件</tspan></text>
<path d="M535,1255 L615,1255" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M615,1345 L535,1345" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M535,1395 L1445,1395" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600" y="1424" font-size="18" fill="#455a64"><tspan x="600" dy="0">取流得到 URL 后，独立通过播放器 TurboModule 播放</tspan></text>
<path d="M1445,1395 L1445,1375" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="1501" font-size="21" fill="#263238"><tspan x="35" dy="0">移植策略：业务接口尽量保持；平台依赖逐个替换或重写。QuickJS 音源脚本 ≠ RN JS 引擎。</tspan></text>
<text x="35" y="1536" font-size="20" fill="#263238"><tspan x="35" dy="0">LXDownload：下载弹窗 → 同一 TurboModule 桥接 → HTTP 流 / fs → Download/LX Music</tspan></text></g></svg>
